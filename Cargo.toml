[package]
name = "ask"
version = "0.1.0"
edition = "2026"
authors = ["Handson Huang <hndsnhuang@gmail.com>"]
description = "A terminal AI assistant that makes getting command help as simple as using man, but smarter"
homepage = "https://github.com/obrr-hhx/ask"
repository = "https://github.com/obrr-hhx/ask"
keywords = ["cli", "ai", "assistant", "terminal"]
categories = ["command-line-utilities"]
license = "MIT"

[features]
default = ["clipboard"]
clipboard = ["arboard"]

[[bin]]
name = "ask"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossterm = "0.27"
anyhow = "1.0"
dirs = "5.0"
futures-util = "0.3"
indicatif = "0.17"
arboard = { version = "3.4", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
atty = "0.2"
lazy_static = "1.4"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
